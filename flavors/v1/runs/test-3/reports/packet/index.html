<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
header{padding:20px 24px 0;max-width:1400px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px}
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}

.kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}

nav{display:flex;gap:4px;border-bottom:1px solid var(--line);max-width:1400px;margin:0 auto;padding:0 24px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer;white-space:nowrap}

main{max-width:1400px;margin:0 auto;padding:20px 24px 60px}
.page{display:none}.page.on{display:block}
.prose{max-width:900px}
.prose h2{font-size:18px;margin:24px 0 8px}.prose h3{font-size:16px;margin:20px 0 6px}
.prose code,.detail code{font-family:var(--mono);font-size:.88em;background:var(--code);padding:1px 4px;border-radius:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;margin:8px 0;font-size:14px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
td{font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:20px;align-items:start}

.node .t{flex:1;font-size:13px;min-width:0}
.node .r{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.node.path .id{color:var(--star)}
.indent{display:inline-block;border-left:1px solid var(--line);height:22px;margin-left:8px;width:10px;flex:none}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;white-space:nowrap}
.b-champ{background:var(--star);color:#1b1400}
.b-win{background:var(--good-soft);color:var(--good)}
.b-null{background:var(--null-soft);color:var(--null)}
.b-fail{background:var(--bad-soft);color:var(--bad)}
.b-diag{background:var(--soft);color:var(--muted)}
.b-off{background:var(--accent-soft);color:var(--accent)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.detail h2{margin:0 0 4px;font-size:19px}
.detail h4{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.detail .txt{white-space:pre-wrap;font-size:14px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.num{background:var(--soft);border-radius:8px;padding:8px 10px}
.num .v{font-weight:650;font-variant-numeric:tabular-nums}
.num .l{font-size:12px;color:var(--muted)}
.pass{color:var(--good);font-weight:600}.fail{color:var(--bad);font-weight:600}
pre.diff{font-family:var(--mono);font-size:12px;line-height:1.45;background:var(--code);border-radius:8px;padding:10px 0;overflow:auto;max-height:70vh;margin:0}

details summary{cursor:pointer;color:var(--accent);font-size:14px}
.files{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;max-width:900px;margin:12px 0 20px}

.themebtn{float:right;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
</style>

ne recurrent state per step instead of k+1 (replay); bitwise exact. +2.6%: below the 3% bar."}]}]}, "records": {"T1-001": {"rec": {"team": "T1", "performance": "unofficial: +2.2% (645.2 vs BASE official 631.4 tok/s, 400 prompts c=16), within noise", "summary": "", "hypothesis": "steps containing a prefill (~35% of wall time) run eager because the prefill CUDA-graph\ngrid stops at 96 tokens on non-SM100; raising it to 2048 should remove CPU launch overhead.", "change": "no code; serve flag --compilation-config '{\"max_prefill_cudagraph_capture_tokens\": 2048}'\n(serve_args.txt). From BASE.", "results": "Observed (worker leader-1.w1, 1 GPU job, lib.sh bench 400 16; logs in\nworkspaces/leader-1.prefillgraph/out/run1/):\n- server log: prefill graphs PIECEWISE 31 sizes (1..2048) + FULL 9; decode FULL 11;\nbreakable CUDA graph auto-enabled. Capture 10 s, 2.07 GiB per rank (BASE value not measured).\nKV 267,721 tokens (fixed by --kv-cache-memory). Ready after 60 s.\n- 645.2 tok/s; TTFT p50 223 / p99 1420 ms; TPOT p50 22.7 / p99 46.95 ms; ITL p99 291.8 ms;\nMTP acceptance 2.343. GSM8K n=50 88.0% (+-4.6; not comparable to n=250).\n- 128K test: 128000-token prompt, /v1/completions max_tokens 64 -> HTTP 200, finish \"stop\",\nsensible text; server healthy after. No errors.\n- worker's pre-run estimate: ~655 tok/s (+4%).", "conclusion": "Interpretation: gain is within the ~3% noise (single run, no same-job BASE). The prefill\nsteps are therefore NOT dominated by CPU launch overhead in the real (non-nsys) run; they\nlook GPU-bound (Marlin + all-reduce + rank skew), consistent with adjacent_field's M1.\nGraphs are PIECEWISE (attention/GDN pieces still eager), so a FULL mixed graph was not tested.\nITL p99 ~292 ms stays: prefill steps still stall decodes.", "validity": "leader-1 review: empty diff; flag only changes CUDA graph capture sizes (same kernels/math).\nMemory change -> 128K test done and passed. OK by task_definition. No official eval requested\n(below noise); candidate st<__nv_bfloat162*>(&b);\n+  float2 fx = __bfloat1622float2(x), fy = __bfloat1622float2(y);\n+  __nv_bfloat162 r = __floats2bfloat162_rn(fx.x + fy.x, fx.y + fy.y);\n+  return *reinterpret_cast<uint32_t*>(&r);\n+}\n+static __device__ __forceinline__ uint4 add4(uint4 a, uint4 b) {\n+  return make_uint4(add_bf16x2(a.x,b.x), add_bf16x2(a.y,b.y), add_bf16x2(a.z,b.z), add_bf16x2(a.w,b.w));\n+}\n+\n+struct Params {\n+  const uint4* x; uint4* out;\n+  uint4* slot[2][2];      // [rank][parity] device ptr to host-mapped data slots\n+  int* flags[2];          // [rank] flag base (host-mapped)\n+  int* state;             // device: [0]=epoch, [1]=done counter\n+  int rank; long n_vec; int K; int mode;\n+};\n+\n+__global__ void hostar_kernel(Params p) {\n+  __shared__ int s_epoch;\n+  const int G = gridDim.x / 2, tid = threadIdx.x, nt = blockDim.x;\n+  const bool writer = blockIdx.x < G;\n+  const int g = writer ? blockIdx.x : blockIdx.x - G;\n+  if (tid == 0) s_epoch = *(volatile int*)&p.state[0];\n+  __syncthreads();\n+  const int epoch = s_epoch, par = epoch & 1;\n+  uint4* mine = p.slot[p.rank][par];\n+  const uint4* peer = p.slot[1 - p.rank][par];\n+  int* myf = p.flags[p.rank] + (size_t)g * MAXK * FSTRIDE;\n+  const int* pf = p.flags[1 - p.rank] + (size_t)g * MAXK * FSTRIDE;\n+  const int K = p.K;\n+  long total_chunks = (long)G * K;\n+  long cs = (p.n_vec + total_chunks - 1) / total_chunks;\n+  for (int c = 0; c < K; c++) {\n+    long lo = ((long)c * G + g) * cs, hi = lo + cs;\n+    if (lo > p.n_vec) lo = p.n_vec; if (hi > p.n_vec) hi = p.n_vec;\n+    if (writer) {\n+      long i = lo + tid;\n+      for (; i + 3 * nt < hi; i += 4 * nt) {\n+        uint4 v0 = p.x[i], v1 = p.x[i+nt], v2 = p.x[i+2*nt], v3 = p.x[i+3*nt];\n+        st_cs(mine+i, v0); st_cs(mine+i+nt, v1); st_cs(mine+i+2*nt, v2); st_cs(mine+i+3*nt, v3);\n+      }\n+      for (; i < hi; i += nt) st_cs(mine + i, p.x[i]);\n+      if (!(p.mode & 4)) __threadfence_system();\n+      __syncthreads();\n+      if (tid == 0 && (p.mode & 4)) __threadfence_system();\n+      if (tid == 0) asm volatile(\"st.volatile.global.s32 [%0], %1;\" :: \"l\"(myf + c * FSTRIDE), \"r\"(epoch) : \"memory\");\n+    } else {\n+      if (tid == 0) {\n+        if (p.mode & 8) { while (ld_vol(pf + c * FSTRIDE) != epoch) { } }  // test-only: old racy check\n+        else { while ((int)(ld_vol(pf + c * FSTRIDE) - epoch) < 0) { } }   // monotonic: peer may be ahead\n+        __threadfence_system();\n+      }\n+      __syncthreads();\n+      long i = lo + tid;\n+      for (; i + 3 * nt < hi; i += 4 * nt) {\n+        uint4 v0 = ld_cv(peer + i), v1 = ld_cv(peer + i + nt), v2 = ld_cv(peer + i + 2*nt), v3 = ld_cv(peer + i + 3*nt);\n+        p.out[i] = add4(p.x[i], v0); p.out[i+nt] = add4(p.x[i+nt], v1);\n+        p.out[i+2*nt] = add4(p.x[i+2*nt], v2); p.out[i+3*nt] = add4(p.x[i+3*nt], v3);\n+      }\n+      for (; i < hi; i += nt) p.out[i] = add4(p.x[i], ld_cv(peer + i));\n+    }\n+  }\n+  __syncthreads();\n+  if (tid == 0) {\n+    __threadfence();\n+    int d = atomicAdd(&p.state[1], 1);\n+    if (d == (int)gridDim.x - 1) { p.state[1] = 0; __threadfence(); *(volatile int*)&p.state[0] = epoch + 1; }\n+  }\n+}\n+\n+struct Ctx {\n+  void* base[1]; size_t slot_bytes; Params p; int* state; bool init=false;\n+};\n+static Ctx C;\n+\n+// Layout of shm file: [rank 0..1][parity 0..1] data slots, then flags [rank][MAXB*MAXK*FSTRIDE ints]\n+size_t total_bytes(size_t slot_bytes) { return 4 * slot_bytes + 2 * (size_t)MAXB * MAXK * FSTRIDE * 4; }\n+\n+void hostar_init(std::string path, int64_t slot_bytes, int64_t rank, bool create) {\n+  size_t tot = total_bytes(slot_bytes);\n+  int fd = open(path.c_str(), O_RDWR | (create ? (O_CREAT) : 0), 0600);\n+  TORCH_CHECK(fd >= 0, \"open failed\");\n+  if (create) TORCH_CHECK(ftruncate(fd, tot) == 0, \"ftruncate\");\n+  void* m = mmap(nullptr, tot, PROT_READ | PROT_WRITE, MAP_SHARED, fd, 0);\n+  TORCH_CHECK(m != MAP_FAILED, \"mmap\");\n+  close(fd);\n+  TORCH_CHECK(cudaHostRegister(m,  bf16: the same math as NCCL).\n+The kernel is CUDA-graph capturable: the flag value (an epoch) lives in device\n+memory and is advanced by the kernel itself.\n+\"\"\"\n+\n+import os\n+import uuid\n+\n+import torch\n+import torch.distributed as dist\n+from torch.distributed import ProcessGroup\n+\n+import vllm.envs as envs\n+from vllm.logger import init_logger\n+\n+logger = init_logger(__name__)\n+\n+_SLOT_BYTES = 24 << 20  # max message size handled; larger falls back to NCCL\n+_MIN_BYTES = 1024\n+_mod = None\n+\n+\n+def _load_ext():\n+    global _mod\n+    if _mod is not None:\n+        return _mod\n+    from torch.utils.cpp_extension import load\n+\n+    if \"TORCH_EXTENSIONS_DIR\" not in os.environ:\n+        os.environ[\"TORCH_EXTENSIONS_DIR\"] = os.path.join(\n+            envs.VLLM_CACHE_ROOT, \"torch_extensions\"\n+        )\n+    build_dir = os.path.join(os.environ[\"TORCH_EXTENSIONS_DIR\"], \"vllm_host_staged_ar\")\n+    os.makedirs(build_dir, exist_ok=True)\n+    major, minor = torch.cuda.get_device_capability()\n+    os.environ.setdefault(\"TORCH_CUDA_ARCH_LIST\", f\"{major}.{minor}\")\n+    src = os.path.join(os.path.dirname(__file__), \"host_staged_ar.cu\")\n+    _mod = load(\"vllm_host_staged_ar\", [src], build_directory=build_dir, verbose=False)\n+    return _mod\n+\n+\n+def _config(nbytes: int) -> tuple[int, int]:\n+    \"\"\"(grid, chunks per writer block) as a function of message size.\"\"\"\n+    if nbytes <= 600 * 1024:\n+        return 8, 1\n+    if nbytes <= 8 << 20:\n+        return 16, 4\n+    return 32, 8\n+\n+\n+class HostStagedAllReduce:\n+    _instance_made = False\n+\n+    def __init__(self, group: ProcessGroup, device: torch.device):\n+        self.disabled = True\n+        if HostStagedAllReduce._instance_made:\n+            return\n+        self.world_size = dist.get_world_size(group=group)\n+        self.rank = dist.get_rank(group=group)\n+        if self.world_size != 2:\n+            return\n+        HostStagedAllReduce._instance_made = True\n+        self.device = device\n+        torch.cuda.set_device(device)\n+        mod = _load_ext()\n+        # rank 0 creates the file; both map it; unlink once both have mapped.\n+        name = [f\"/dev/shm/vllm_hostar_{os.getpid()}_{uuid.uuid4().hex}\"]\n+        dist.broadcast_object_list(name, src=dist.get_process_group_ranks(group)[0],\n+                                   group=group)\n+        path = name[0]\n+        if self.rank == 0:\n+            mod.init(path, _SLOT_BYTES, 0, True)\n+        dist.barrier(group=group)\n+        if self.rank == 1:\n+            mod.init(path, _SLOT_BYTES, 1, False)\n+        dist.barrier(group=group)\n+        if self.rank == 0:\n+            os.unlink(path)\n+        self.mod = mod\n+        self.disabled = False\n+        logger.info(\"Host-staged all-reduce (no-P2P, 2 ranks) enabled\")\n+\n+    def should_use(self, inp: torch.Tensor) -> bool:\n+        if self.disabled or inp.dtype != torch.bfloat16 or not inp.is_cuda:\n+            return False\n+        nbytes = inp.numel() * inp.element_size()\n+        return (\n+            _MIN_BYTES <= nbytes <= _SLOT_BYTES\n+            and nbytes % 16 == 0\n+            and inp.is_contiguous()\n+        )\n+\n+    def all_reduce(self, inp: torch.Tensor) -> torch.Tensor:\n+        out = torch.empty_like(inp)\n+        grid, k = _config(inp.numel() * 2)\n+        self.mod.allreduce(inp, out, grid, k, 512, 4)\n+        return out\n", "diff_files": ["vllm/distributed/device_communicators/cuda_communicator.py", "vllm/distributed/device_communicators/host_staged_ar.cu", "vllm/distributed/device_communicators/host_staged_ar.py"], "same_code_as_parent": false, "delta_vs_parent": "diff --git a/vllm/distributed/device_communicators/cuda_communicator.py b/vllm/distributed/device_communicators/cuda_communicator.py\nindex 56c9e33ee4..07b44c6774 100644\n--- a/vllm/distributed/device_communicators/cuda_communicator.py\n+++ b/vllm/distributed/device_communicators/cuda_communicator. ocally (fp32 add, round to bf16: the same math as NCCL).\n+The kernel is CUDA-graph capturable: the flag value (an epoch) lives in device\n+memory and is advanced by the kernel itself.\n+\"\"\"\n+\n+import os\n+import uuid\n+\n+import torch\n+import torch.distributed as dist\n+from torch.distributed import ProcessGroup\n+\n+import vllm.envs as envs\n+from vllm.logger import init_logger\n+\n+logger = init_logger(__name__)\n+\n+_SLOT_BYTES = 24 << 20  # max message size handled; larger falls back to NCCL\n+_MIN_BYTES = 1024\n+_mod = None\n+\n+\n+def _load_ext():\n+    global _mod\n+    if _mod is not None:\n+        return _mod\n+    from torch.utils.cpp_extension import load\n+\n+    if \"TORCH_EXTENSIONS_DIR\" not in os.environ:\n+        os.environ[\"TORCH_EXTENSIONS_DIR\"] = os.path.join(\n+            envs.VLLM_CACHE_ROOT, \"torch_extensions\"\n+        )\n+    build_dir = os.path.join(os.environ[\"TORCH_EXTENSIONS_DIR\"], \"vllm_host_staged_ar\")\n+    os.makedirs(build_dir, exist_ok=True)\n+    major, minor = torch.cuda.get_device_capability()\n+    os.environ.setdefault(\"TORCH_CUDA_ARCH_LIST\", f\"{major}.{minor}\")\n+    src = os.path.join(os.path.dirname(__file__), \"host_staged_ar.cu\")\n+    _mod = load(\"vllm_host_staged_ar\", [src], build_directory=build_dir, verbose=False)\n+    return _mod\n+\n+\n+def _config(nbytes: int) -> tuple[int, int]:\n+    \"\"\"(grid, chunks per writer block) as a function of message size.\"\"\"\n+    if nbytes <= 600 * 1024:\n+        return 8, 1\n+    if nbytes <= 8 << 20:\n+        return 16, 4\n+    return 32, 8\n+\n+\n+class HostStagedAllReduce:\n+    _instance_made = False\n+\n+    def __init__(self, group: ProcessGroup, device: torch.device):\n+        self.disabled = True\n+        if HostStagedAllReduce._instance_made:\n+            return\n+        self.world_size = dist.get_world_size(group=group)\n+        self.rank = dist.get_rank(group=group)\n+        if self.world_size != 2:\n+            return\n+        Host %3}, [%4];\" : \"=r\"(r.x),\"=r\"(r.y),\"=r\"(r.z),\"=r\"(r.w) : \"l\"(p) : \"memory\");\n+  return r;\n+}\n+static __device__ __forceinline__ void st_cs(uint4* p, uint4 v) {\n+  asm volatile(\"st.global.cs.v4.u32 [%0], {%1,%2,%3,%4};\" :: \"l\"(p),\"r\"(v.x),\"r\"(v.y),\"r\"(v.z),\"r\"(v.w) : \"memory\");\n+}\n+static __device__ __forceinline__ int ld_vol(const int* p) {\n+  int r; asm volatile(\"ld.volatile.global.s32 %0, [%1];\" : \"=r\"(r) : \"l\"(p) : \"memory\"); return r;\n+}\n+static __device__ __forceinline__ uint32_t add_bf16x2(uint32_t a, uint32_t b) {\n+  __nv_bfloat162 x = *reinterpret_cast<__nv_bfloat162*>(&a), y = *reinterpret_cast<__nv_bfloat162*>(&b);\n+  float2 fx = __bfloat1622float2(x), fy = __bfloat1622float2(y);\n+  __nv_bfloat162 r = __floats2bfloat162_rn(fx.x + fy.x, fx.y + fy.y);\n+  return *reinterpret_cast<uint32_t*>(&r);\n+}\n+static __device__ __forceinline__ uint4 add4(uint4 a, uint4 b) {\n+  return make_uint4(add_bf16x2(a.x,b.x), add_bf16x2(a.y,b.y), add_bf16x2(a.z,b.z), add_bf16x2(a.w,b.w));\n+}\n+\n+struct Params {\n+  const uint4* x; uint4* out;\n+  uint4* slot[2][2];      // [rank][parity] device ptr to host-mapped data slots\n+  int* flags[2];          // [rank] flag base (host-mapped)\n+  int* state;             // device: [0]=epoch, [1]=done counter\n+  int rank; long n_vec; int K; int mode; int gather; long inner_vec;\n+};\n+\n+__global__ void hostar_kernel(Params p) {\n+  __shared__ int s_epoch;\n+  const int G = gridDim.x / 2, tid = threadIdx.x, nt = blockDim.x;\n+  const bool writer = blockIdx.x < G;\n+  const int g = writer ? blockIdx.x : blockIdx.x - G;\n+  if (tid == 0) s_epoch = *(volatile int*)&p.state[0];\n+  __syncthreads();\n+  const int epoch = s_epoch, par = epoch & 1;\n+  uint4* mine = p.slot[p.rank][par];\n+  const uint4* peer = p.slot[1 - p.rank][par];\n+  int* myf = p.flags[p.rank] + (size_t)g * MAXK * FSTRIDE;\n+  const int* pf = p.flags[1 - p.rank] + (size_t)g * MAXK * FSTRIDE;\n+  const int K = p.K;\n+  long lReduce:\n+    _instance_made = False\n+\n+    def __init__(self, group: ProcessGroup, device: torch.device):\n+        self.disabled = True\n+        if HostStagedAllReduce._instance_made:\n+            return\n+        self.world_size = dist.get_world_size(group=group)\n+        self.rank = dist.get_rank(group=group)\n+        if self.world_size != 2:\n+            return\n+        HostStagedAllReduce._instance_made = True\n+        self.device = device\n+        torch.cuda.set_device(device)\n+        mod = _load_ext()\n+        # rank 0 creates the file; both map it; unlink once both have mapped.\n+        name = [f\"/dev/shm/vllm_hostar_{os.getpid()}_{uuid.uuid4().hex}\"]\n+        dist.broadcast_object_list(name, src=dist.get_process_group_ranks(group)[0],\n+                                   group=group)\n+        path = name[0]\n+        if self.rank == 0:\n+            mod.init(path, _SLOT_BYTES, 0, True)\n+        dist.barrier(group=group)\n+        if self.rank == 1:\n+            mod.init(path, _SLOT_BYTES, 1, False)\n+        dist.barrier(group=group)\n+        if self.rank == 0:\n+            os.unlink(path)\n+        self.mod = mod\n+        self.disabled = False\n+        logger.info(\"Host-staged all-reduce (no-P2P, 2 ranks) enabled\")\n+\n+    def should_use(self, inp: torch.Tensor) -> bool:\n+        if self.disabled or inp.dtype != torch.bfloat16 or not inp.is_cuda:\n+            return False\n+        nbytes = inp.numel() * inp.element_size()\n+        return (\n+            _MIN_BYTES <= nbytes <= _SLOT_BYTES\n+            and nbytes % 16 == 0\n+            and inp.is_contiguous()\n+        )\n+\n+    def all_reduce(self, inp: torch.Tensor) -> torch.Tensor:\n+        out = torch.empty_like(inp)\n+        grid, k = _config(inp.numel() * 2)\n+        self.mod.allreduce(inp, out, grid, k, 512, 4)\n+        return out\n+\n+    def should_use_all_gather(self, inp: torch.Tensor, dim: int) -> bool:\n+        if self.disabled or not inp.is_cuda or not sed_gdn_decode_kernel.cu", "csrc/ops.h", "csrc/torch_bindings.cpp", "vllm/_custom_ops.py", "vllm/model_executor/layers/mamba/gdn/qwen_gdn_linear_attn.py", "vllm/model_executor/layers/mamba/gdn/replay.py", "vllm/v1/worker/gpu/model_states/mamba_hybrid.py"]}}, "base": [{"ok": true, "output_throughput": 631.4170936634974, "output_throughput_trials": null, "output_throughput_cv_pct": null, "median_ttft_ms": 251.03514175862074, "p99_ttft_ms": 1486.593298651278, "median_tpot_ms": 23.202830286075233, "p99_tpot_ms": 48.39479430409314, "mtp_acceptance_length": 2.34, "gsm8k_accuracy": 0.928, "gate_gsm8k": "pass", "gate_latency": null, "gate_long_request": null, "vs_baseline_pct": null, "n": "1"}], "pages": {"overview": "<h3>Goal<\/h3>\n<p>Serve <strong>Qwen3.8-27B-FP8 on 2x RTX 4090<\/strong> (no GPU peer-to-peer) faster: maximize <strong>output tokens/s at concurrency 16<\/strong> on a fixed ShareGPT benchmark (400 prompts, temperature 0), <strong>without changing what the model computes<\/strong>. FP8 weights and FP8 KV cache stay; activations stay bf16; speculative decoding must stay exact. Gates: TTFT p99 \u2264 1784 ms and TPOT p99 \u2264 58.1 ms (BASE +20%), GSM8K \u2265 89.6%, and one 128K-token request must still be served. Differences under 3% count as noise.<\/p>\n<h3>Result<\/h3>\n<div class='tw'><table><thead><tr><th><\/th><th>output tok/s<\/th><th>vs BASE<\/th><th>TTFT p99<\/th><th>TPOT p99<\/th><th>GSM8K<\/th><\/tr><\/thead><tbody><tr><td>BASE (stock vLLM)<\/td><td>631.4<\/td><td><\/td><td>1487 ms<\/td><td>48.4 ms<\/td><td>92.8%<\/td><\/tr><tr><td>Round 1 champion T1-005<\/td><td>699.2<\/td><td>+10.7%<\/td><td>1309 ms<\/td><td>50.6 ms<\/td><td>93.2%<\/td><\/tr><tr><td><strong>Champion T1-009<\/strong> (round 2)<\/td><td><strong>730.9<\/strong><\/td><td><strong>+15.8%<\/strong><\/td><td>1438 ms<\/td><td>41.3 ms<\/td><td>93.6%<\/td><\/tr><tr><td>Best measured T1-012 (round 3)<\/td><td>749.7<\/td><td>+18.7%<\/td><td>1426 ms<\/td><td>43.3 ms<\/td><td>93.6%<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Decision for you:<\/strong> T1-012 is +2.6% over T1-009, below the agreed 3% bar, so it is <strong>not<\/strong> the champion by rule. The gain is consistent across three measurements (same-job A/B +2.2%, microbenchmark ~2 ms/step saved, 2 official trials 746.0/753.5 vs 729.7/732.1), and the change is bitwise exact. I recommend promoting it by decision. Caveat: preemption/resume is untested for it.<\/p>\n<h3>What worked<\/h3>\n<ul><li>\n<strong>Host-staged all-reduce<\/strong> (T1-002): the two GPUs exchange partial sums through pinned host memory instead of NCCL. Bitwise equal to NCCL; decode all-reduce 61 \u2192 50 \u00b5s. +5.0%.\n<\/li><li>\n<strong>CUDA graphs for mixed prefill steps<\/strong> (flag): worthless alone, but +4.8% on top of the faster all-reduce (T1-005).\n<\/li><li>\n<strong>Logits diet<\/strong> (T1-006/007/009): local-argmax drafts, FP8 draft head (drafter only), and a greedy verification fast path that gathers (max, argmax) instead of full logits. Together +4.5%.\n<\/li><li>\n<strong>GDN state checkpoint + replay<\/strong> (T1-012): write one recurrent state per decode step instead of one per speculative token. +2.6%.\n<\/li><\/ul>\n<h3>What didn't<\/h3>\n<ul><li>\n<strong>3 draft tokens<\/strong> (T1-008, T1-010, T1-011): +15% acceptance, but each request then needs more spec-state pages, only 14 of 16 requests fit, and no larger KV budget fits in memory.\n<\/li><li>\n<strong>NCCL tuning<\/strong> (measured in a microbenchmark), <strong>pipeline parallelism<\/strong>, <strong>Marlin retuning<\/strong>, <strong>reduced-vocab draft head<\/strong>: ruled out with numbers.\n<\/li><\/ul>\n<h3>Things to know about this machine<\/h3>\n<ul><li>\n<strong>GPU 0's clock is locked at 2235 MHz<\/strong> (GPU 1 boosts to ~2600 MHz). GPU 0 is ~15% slower on compute, so ~7% of wall time is spent waiting for it. Accepted as fixed; BASE was measured under it too.\n<\/li><li>\nNo peer-to-peer between the GPUs: all GPU-to-GPU traffic crosses PCIe through host memory.\n<\/li><\/ul>\n<h3>Open questions / next steps<\/h3>\n<ul><li>\n<strong>Promote T1-012?<\/strong> (above)\n<\/li><li>\n<strong>R3-B v2<\/strong>: shrink the per-request GDN spec state to one page so 3 draft tokens fit 16 requests in the same memory (est. a few % more; risky integration).\n<\/li><li>\nLossless compression of the all-reduce payload and L2 prefetch during the all-reduce: proposed, untried (see Untried ideas).\n<\/li><li>\nRemaining decode step (~35 ms): Marlin FP8 GEMMs ~18.5 ms, host all-reduce ~5.7 ms, lm_heads ~3 ms, GDN ~3 ms.\n<\/li><\/ul>\n<h3>How to read this packet<\/h3>\n<ul><li>\n<strong>Experiment tree<\/strong>: every experiment, by direction. \u2605 marks the champion's path; click a node for what changed, why, the numbers, the conclusion, the validity review and the code diff.\n<\/li><li>\n<strong>Insights (KB)<\/strong>: confirmed findings, each citing its records. <strong>Untried ideas<\/strong>: scored but not run. <strong>Rules &amp; assumptions<\/strong>: the task definition, the human's rulings, and accepted facts.\n<\/li><li>\n<code>diffs/<\/code> has each record's diff against the baseline vLLM; <code>data/<\/code> has the run's markdown files (reports, journal).\n<\/li><\/ul>", "kb": "<h2>SHARED_KB (run test-3)<\/h2>\n<ul><li>\n<strong>KB1.<\/strong> On BASE, prefill-containing steps are GPU-bound, not CPU-launch-bound: graphing them (prefill graph cap 2048) gives only +2.2% unofficial on NCCL. (T1-001)\n<\/li><li>\n<strong>KB2.<\/strong> In-server decode AR: NCCL 60.8 us -&gt; host-staged 49.6 us mean (post-arrival 48.1 -&gt; 34.0 us), ~1.5 ms/decode step saved; all of T1-002's gain is from decode. (T1-002, T1-003)\n<\/li><li>\n<strong>KB3.<\/strong> Prefill-step ARs (~620 us) carry ~250-316 us mean rank-start skew; transport speed doesn't change them (post-arrival ~510-520 us with either backend). (T1-003)\n<\/li><li>\n<strong>KB4.<\/strong> Prefill-graph flag on top of host-staged AR cuts skew (prefill AR 316 -&gt; 214 us, decode 30 -&gt; 10 us) and pays +4.8% vs +2.2% on NCCL: the two stack super-additively. Cause not separated (skew vs launch count). (T1-005)\n<\/li><li>\n<strong>KB5.<\/strong> PCIe here only partly overlaps up/down traffic from SMs: concurrent host write+read of 491 KB = 41 us vs 25-27 us alone; a system-scope fence/ack round trip ~5 us. Host-staged AR at M=48 is within ~5 us of its floor; chunk pipelining loses. (T1-003)\n<\/li><li>\n<strong>KB6.<\/strong> Logits all-gathers ~1.1 ms/decode step (946 us target + 2 x 330 us drafts, partly skew); the host path saves only ~0.3 ms. (T1-004)\n<\/li><li>\n<strong>KB7.<\/strong> CUDA-graph capture memory with host-staged comms: 1.33 GiB/rank vs 2.07 GiB with NCCL at the same sizes. (T1-001, T1-005)\n<\/li><li>\n<strong>KB8.<\/strong> GPU 0's SM clock is locked at 2235 MHz (idle and under load); GPU 1 boosts to ~2400-2670 MHz. Confirmed in the official gpu_clocks.csv of BASE and T1-002. Compute-bound kernels are ~15-17% slower on GPU 0 (BASE, T1-002, T1-005 alike); memory-bound decode Marlin only ~2-4%. This is the source of the prefill-step AR skew in KB3/KB4: rank 0 arrives last at 92-96% of prefill ARs; ~7% of wall time is spent waiting for GPU 0. Not fixable in software without root; uneven TP nets \u2248 0. (bs-r2-systematic_engineer clk job agents/bs-r2-systematic_engineer/clk/; bs-r2-adjacent_field a6.py; official gpu_clocks.csv)\n<\/li><li>\n<strong>KB9.<\/strong> Champion decode step (T1-005, 16 seqs, 38.5 ms): Marlin ~18.5 ms; host AR ~5.6-5.9 ms; lm_heads 4.3 ms (target 1.59 + 2 drafts x 1.37); logits all-gathers 1.67 ms; GDN MTP decode 3.65 ms. GDN decode writes 3 full fp32 states per step (75 MB writes + 25 MB reads per layer), with a measured spill into the next GEMM (gate_up 141 us after GDN vs 122 us after attention). (brainstorm/r2/*.md, T1-005 nsys)\n<\/li><li>\n<strong>KB10.<\/strong> FP8 draft lm_head costs no MTP acceptance on this model (2.343 vs 2.340); local-argmax drafts ~+1%; greedy target local-argmax ~+2%; together ~+4.5% over T1-005. (T1-006, T1-007, T1-009)\n<\/li><li>\n<strong>KB11.<\/strong> 3 MTP draft tokens on T1-007: acceptance 2.36 -&gt; 2.72, decode TPOT p50 -6%, but TTFT p50 210 -&gt; 792 ms (p99 2133 ms, gate fail) and throughput -7%. Mechanism unknown (slower prefill/mixed steps or delayed admission). (T1-008)\n<\/li><li>\n<strong>KB12.<\/strong> Greedy verification rows have bf16 ties for the max in ~1.8% of rows (467/25,511): tie-break exactness matters. (T1-009)\n<\/li><li>\n<strong>KB13.<\/strong> T1-008's k=3 TTFT blow-up (KB11) was an admission/capacity stall, not slower compute: its server.log shows \"Running: 14, Waiting: 2, KV usage 95.3%\" throughout. GDN spec-state pages share the 5 GiB block pool (with prefix caching in align mode): 10 blocks/request at k=2, 13 at k=3 (~365 MB/request), so only 14 of 16 fit. (bs-r3-adjacent_field F1, bs-r3-systematic_engineer; bank/T1-008 server log)\n<\/li><li>\n<strong>KB14.<\/strong> GDN decode costs ~5.3 ms of a full decode step: 3.65 ms in-kernel + ~1.7 ms measured spill into the following Marlin GEMMs. Marlin M=48 in-kernel penalty vs M=3 is only ~1.6 ms/step; k=4 hits a Marlin cliff at M=80 (17.2 -&gt; 24.7 ms/step). (bs-r3-systematic_engineer microbench agents/bs-r3-systematic_engineer/mb/)\n<\/li><li>\n<strong>KB15.<\/strong> GDN replay (write one state per step): the stock MTP kernel at 16 x 3 tokens costs ~123 us/layer in isolation vs ~76 us in-server, because part of its 75 MB of state writes is evicted from L2 into the next GEMMs. Replay saves ~45-50 us/layer including that spill, ~2 ms/decode step; official +2.6% (T1-012).\n<\/li><li>\n<strong>KB16.<\/strong> Memory ceiling with T1-009's args: ~7.9 GiB/rank left after the model (14.99 GiB). KV &gt; ~5.0 GiB fails: OOM in graph capture at 5.5 GiB; runtime OOM at 5.6 GiB even with graphs trimmed to 1.08 GiB. Graph trimming buys only ~0.26 GiB. More capacity must come from smaller per-request state. (T1-010, T1-011)\n<\/li><li>\n<strong>KB17.<\/strong> GDN spec blocks per request scale with num_speculative_tokens (MambaBase.get_kv_cache_spec, abstract.py:94); already 0 for Mamba2 ReplaySSM. Observed 10 blocks/req at k=2, 13 at k=3. (leader-1.w6 analysis)\n<\/li><\/ul>", "ideas": "<h2>IDEAS (run test-3): scored but untried. An archive, not a queue.<\/h2>\n<p>These are never selected directly: an idea comes back only if a brainstormer proposes it again. Scores: novelty (N) and upside (U), 1-5. Sources: SE = systematic_engineer, AF = adjacent_field. Brainstorm files: brainstorm/r&lt;round&gt;/*.md.<\/p>\n<h3>Round 1 (base: BASE)<\/h3>\n<div class='tw'><table><thead><tr><th>id<\/th><th>idea<\/th><th>from<\/th><th>N<\/th><th>U<\/th><th>note<\/th><\/tr><\/thead><tbody><tr><td>R1-C<\/td><td>NCCL env tuning (protocol / channels / buffsize)<\/td><td>SE<\/td><td>1<\/td><td>1<\/td><td>AF measured it: at most -6% time at prefill size, worse at decode. Effectively ruled out.<\/td><\/tr><tr><td>R1-D<\/td><td>L2 prefetch of the next GEMM's weights during each AR<\/td><td>SE, AF<\/td><td>5<\/td><td>3<\/td><td>Re-proposed in r2 as R2-C.<\/td><\/tr><tr><td>R1-E<\/td><td>Marlin per-shape retune for M=48<\/td><td>SE<\/td><td>2<\/td><td>3<\/td><td>Re-proposed in r2 as R2-D.<\/td><\/tr><tr><td>R1-F<\/td><td>Local argmax for draft logits<\/td><td>SE, AF<\/td><td>1<\/td><td>1<\/td><td>Later done as T1-006 (r2, under R2-A).<\/td><\/tr><tr><td>R1-G<\/td><td>Greedy target-verification local argmax<\/td><td>AF<\/td><td>2<\/td><td>2<\/td><td>Later done as T1-009 (r2, under R2-A).<\/td><\/tr><tr><td>R1-H<\/td><td>In-place FlashInfer draft-metadata update (~1 ms CPU gaps)<\/td><td>SE<\/td><td>2<\/td><td>2<\/td><td>Gaps measured under nsys.<\/td><\/tr><tr><td>R1-I<\/td><td>FP8 draft lm_head<\/td><td>AF<\/td><td>1<\/td><td>2<\/td><td>Later done as T1-007 (r2, under R2-A).<\/td><\/tr><tr><td>R1-J<\/td><td>Reduced-vocab draft lm_head (non-benchmark frequencies)<\/td><td>SE, AF<\/td><td>3<\/td><td>3<\/td><td>Allowed (ruling 2); untried.<\/td><\/tr><tr><td>R1-K<\/td><td>GDN: write one spec state per step instead of three<\/td><td>SE<\/td><td>4<\/td><td>2<\/td><td>Re-proposed in r2 as R2-B.<\/td><\/tr><tr><td>R1-L<\/td><td>Prefill AR/compute overlap with micro-batches<\/td><td>AF<\/td><td>4<\/td><td>2<\/td><td>Mostly ruled down in r2: the skew is from GPU 0's clock (KB8).<\/td><\/tr><\/tbody><\/table><\/div>\n<h3>Round 2 (base: T1-005)<\/h3>\n<div class='tw'><table><thead><tr><th>id<\/th><th>idea<\/th><th>from<\/th><th>N<\/th><th>U<\/th><th>note<\/th><\/tr><\/thead><tbody><tr><td>R2-B<\/td><td>GDN spec-state checkpoint + log replay<\/td><td>AF1, SE4<\/td><td>4<\/td><td>3<\/td><td>100 MB/layer of state traffic, spill measured (~5 ms/step); est. +3.5-5%; medium-high effort.<\/td><\/tr><tr><td>R2-C<\/td><td>L2 prefetch during the host-AR windows<\/td><td>SE2<\/td><td>5<\/td><td>3<\/td><td>Est. +3-7%, low-medium confidence; 1-GPU-min kill test.<\/td><\/tr><tr><td>R2-D<\/td><td>Marlin decode M=48 retune (670 vs 800 GB/s at M=3)<\/td><td>SE3<\/td><td>2<\/td><td>3<\/td><td>Est. +5%.<\/td><\/tr><tr><td>R2-E<\/td><td>Copy-engine full-duplex AR for large M<\/td><td>AF3<\/td><td>2<\/td><td>2<\/td><td>~+1.5-3%; half the prefill AR is the GPU 0 skew.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Ruled down with numbers (from the brainstorms):<\/p>\n<ul><li>\nPP=2.\n<\/li><li>\nChasing the prefill skew, or uneven TP (KB8).\n<\/li><li>\nThe decode step-start gap (an nsys artifact).\n<\/li><li>\nDequant + cuBLAS for prefill GEMMs.\n<\/li><\/ul>\n<h3>Round 3 (base: T1-009)<\/h3>\n<p>Selected: R3-A + R3-B (see tree.md). Scored for the record: R3-A (k=3 with a KV budget that holds 16 requests; both brainstormers; N2 U3, est. +2-5% alone) and R3-B (GDN spec-state checkpoint + replay, = R2-B; both; N4 U4, est. +4.5-6%, frees spec pages so k=3 fits without extra KV).<\/p>\n<div class='tw'><table><thead><tr><th>id<\/th><th>idea<\/th><th>from<\/th><th>N<\/th><th>U<\/th><th>note<\/th><\/tr><\/thead><tbody><tr><td>R3-C<\/td><td>Bitwise-lossless compression of the AR payload (bf16 exponent packing, raw overflow fallback)<\/td><td>AF2<\/td><td>5<\/td><td>2<\/td><td>Est. +2-3%, depends on measured compressibility; ruled baseline-precision by the manager (lossless for all inputs, generic parameters). Near-free kill test (1 dump + CPU analysis).<\/td><\/tr><tr><td>R3-D<\/td><td>L2 prefetch of gate_up during the host-AR window (= R2-C, re-scoped)<\/td><td>SE3<\/td><td>5<\/td><td>2<\/td><td>Do only after R3-B: the dirty-L2 drain from GDN state writes would fight the prefetch. Est. +3-5%, low confidence.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Ruled down (r3, with numbers):<\/p>\n<ul><li>\nMarlin M=48 retune (R2-D): the in-kernel penalty is only 1.6 ms/step; the rest is GDN spill. SE microbench agents/bs-r3-systematic_engineer/mb/.\n<\/li><li>\nk=4: Marlin cliff at M=80 (17.2 -&gt; 24.7 ms/step).\n<\/li><li>\nReduced-vocab draft head (R1-J): net \u2248 0 now that the drafts are FP8.\n<\/li><li>\nRebalancing weights for the GPU 0 skew: \u22643%, and it costs memory.\n<\/li><\/ul>\n<p>Left open after round 3 (from leader-1's report, not yet scored by a brainstorm):<\/p>\n<ul><li>\nR3-B v2: shrink the GDN spec blocks per request to 1 (the log slot), so k=3 fits 16 requests in 5 GiB. Needs the stock per-token layout removed everywhere; risk: silent state corruption from an unknown reader.\n<\/li><li>\nRedundant conv-state work in the replay kernel.\n<\/li><li>\nT1-012 preemption/resume test.\n<\/li><\/ul>", "rules": "<h2>Task definition (run test-3). Refines task/TASK.md; where they differ, this file wins.<\/h2>\n<h3>Objective and gates<\/h3>\n<ul><li>\nScore: output tok/s at concurrency 16 on the official benchmark (official_eval only). Noise:\n differences &lt; 3% are not results.\n<\/li><li>\nLatency gates: TTFT p99 and TPOT p99 must not be more than 20% worse than **this run's BASE\n official numbers** (as computed by official_eval), not TASK.md's figures.\n<\/li><li>\nAccuracy gate: GSM8K-250 &gt;= 89.6%.\n<\/li><\/ul>\n<h3>Correctness<\/h3>\n<ul><li>\nSame function as the baseline: floating-point reordering and different kernels are OK; no\n approximation (no lossy quantization, skipped layers, truncated vocab, early exits).\n<\/li><li>\nWeights stay FP8 and the KV cache stays FP8: nothing lower precision, no higher-precision copies\n that change the memory picture unfairly.\n<\/li><li>\n**Activations stay as in the baseline (bf16 compute through the weight-only FP8 path). FP8\n activations / W8A8 / true FP8 compute instead of bf16 activations are FORBIDDEN.**\n<\/li><li>\nCommunication stays at the baseline's precision (e.g. no FP8/quantized all-reduce): it is an\n approximation.\n<\/li><li>\nSpeculative decoding: method and draft count may change only if exact (verification against\n the target model; greedy output identical to the target's). Approximate acceptance (typical\n acceptance, relaxed thresholds, etc.) is forbidden.\n<\/li><li>\nSampling as the benchmark requests (temperature 0, max tokens, chat template, thinking as\n requested). Outputs never cut short or altered; every request answered in full.\n<\/li><li>\nThe server stays a general OpenAI-compatible server; the reasoning parser (qwen3) and tool\n parser (qwen3_coder) stay enabled and working.\n<\/li><\/ul>\n<h3>Hard constraints<\/h3>\n<ul><li>\nFixed: model, benchmark, dataset, harness, accuracy gate, hardware (these 2 GPUs). Agents never\n modify task/.\n<\/li><li>\n--max-num-seqs &gt;= 16.\n<\/li><li>\nMax context may shrink and the KV budget may change only if one 128K-token request still fits\n and is served correctly (a leader claiming this must show it was tested).\n<\/li><li>\nParallelism (TP/PP/hybrid) may change. Other serving flags (via serve_args.txt) and engine code\n are open.\n<\/li><li>\nAny change that affects memory use (KV budget, max context, max-num-seqs / batch sizes, CUDA\n graph sizes, spec-decode draft count, parallelism, ...) must be shown not to crash or OOM under\n the benchmark load and with one 128K request. Pure kernel or scheduling changes don't need the\n 128K test.\n<\/li><\/ul>\n<h3>Loopholes (forbidden)<\/h3>\n<ul><li>\nCaching or precomputing outputs (or prefill results) for the benchmark prompts; prefix caching\n tuned to the benchmark (generic default prefix caching is fine).\n<\/li><li>\nShortening, truncating or altering outputs; changing temperature, or thinking on/off.\n<\/li><li>\nInexact speculative decoding.\n<\/li><li>\nNo behavior keyed to the benchmark's concurrency, prompts or seed (no detecting the benchmark).\n c=16 is the target load and tuning for it is fine, but other loads must still work correctly.\n<\/li><li>\nDisabling the reasoning or tool parsers; max-num-seqs below 16.\n<\/li><li>\nAnything tuned to seed 0 or these 400 prompts (e.g. a draft model / n-gram table built from\n ShareGPT benchmark data).\n<\/li><\/ul>\n<p>When unsure whether something is allowed: ask the manager before building on it.<\/p>\n<h3>Rulings (human, round 1)<\/h3>\n<ul><li>\nFP8 draft lm_head (<code>draft_lm_head_quantization=\"fp8\"<\/code>): ALLOWED, only inside the MTP drafter.\n Verification stays exact against the target at baseline precision (identical output). The\n target model's activations stay as in the baseline.\n<\/li><li>\nReduced-vocab draft lm_head: ALLOWED if the token frequencies/ids come from non-benchmark text\n (never ShareGPT or any benchmark data) and verification stays full-vocab and exact.\n<\/li><li>\nEnv-var or config defaults changed in code (in change.diff): ALLOWED if they are generic\n defaults, not keyed to the benchmark (its prompts, seed or concurrency).\n<\/li><\/ul><hr><h2>Assumption ledger (run test-3)<\/h2>\n<h3>Frozen<\/h3>\n<p>Model + FP8 weights; FP8 KV cache; bf16 activations (no FP8 activations / W8A8); baseline-precision communication; sampling as requested; benchmark/harness/gates; 2x RTX 4090; reasoning + tool parsers on; max-num-seqs &gt;= 16; exact spec decode only; one 128K request must still fit.<\/p>\n<h3>Open<\/h3>\n<p>Engine code (kernels, scheduler, memory, comms, compilation); parallelism scheme (TP/PP/hybrid); serving flags via serve_args.txt; spec-decode method/draft count (exact only); max context and KV budget (within the 128K rule).<\/p>\n<h3>Assumptions<\/h3>\n<ul><li>\nLatency gates are relative to this run's BASE official numbers.\n<\/li><li>\nNoise ~0.5% CV; &lt; 3% treated as noise.\n<\/li><li>\nConfig defaults: 1 leader, up to 2 workers, 5 rounds, 80 GPU-min per team per round,\n brainstormers systematic_engineer + adjacent_field.\n<\/li><\/ul>\n<h3>Accepted environment facts (human, round 2)<\/h3>\n<ul><li>\nGPU 0's SM clock is locked at 2235 MHz (GPU 1 boosts to ~2400-2670 MHz): a fixed fact of this\n machine. No planned change. GPU 0 is ~15% slower on compute-bound work (KB8).\n<\/li><li>\nAnother user's long-running nsys agent and their idle MPS control daemons are on this server\n (why profiler counters work only on GPU 0). Neither counts as \"someone else using the GPUs\".\n<\/li><\/ul>\n<h3>How correctness is judged (human, round 2; TASK.md's Correctness section says the same)<\/h3>\n<p>Identical output text is NOT a correctness test: even at temperature 0, results depend on batch composition and kernel choice, so the same code at c=16 can produce different text run to run, and a valid fp reordering can flip a near-tie. Judge correctness by:<\/p>\n<ul><li>\nthe math: exact by construction, or a bounded-error reordering;\n<\/li><li>\nnumeric checks of the changed op against the old op on the same inputs;\n<\/li><li>\nGSM8K and MTP acceptance.\n<\/li><\/ul>\n<p>Token-for-token output comparison is meaningful only for bitwise-exact changes, run one request at a time (no batching effects).<\/p>"}};

  if(t) document.documentElement.dataset.theme=t;
  $("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx; try{localStorage.setItem("ai-theme",nx)}catch(e){}};
})();

// header
$("#title").textContent = S.title; $("#subtitle").textContent = S.subtitle;
$("#kpis").innerHTML = S.kpis.map(k=>`<div class="kpi"><div class="v">${esc(k.v)}</div><div class="l">${esc(k.l)}</div></div>`).join("");

// tabs
const TABS=[["overview","Overview"],["tree","Experiment tree"],["kb","Insights (KB)"],["ideas","Untried ideas"],["rules","Rules & assumptions"]];
$("#tabs").innerHTML = TABS.map(([id,l])=>`<button role="tab" data-t="${id}">${l}</button>`).join("");
function show(id){ document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id==="p-"+id));
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===id));
  try{history.replaceState(null,"","#"+id+(id==="tree"&&cur?":"+cur:""))}catch(e){} }
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));

// pages
$("#overview").innerHTML = DATA.pages.overview; $("#kb").innerHTML = DATA.pages.kb;
$("#ideas").innerHTML = DATA.pages.ideas; $("#rules").innerHTML = DATA.pages.rules;

// progression chart
(function(){
  const pts=S.progress; if(!pts||!pts.length) return;
  const W=860,H=230,L=60,Rr=20,T=24,B=40, max=Math.max(...pts.map(p=>p.v))*1.08, min=Math.min(...pts.map(p=>p.v))*0.9;
  const x=i=>L+(W-L-Rr)*(pts.length===1?0.5:i/(pts.length-1)), y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Champion output tokens per second by round">`;
  for(let k=0;k<4;k++){const v=min+(max-min)*k/3;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v.toFixed(0)}</text>`;}
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>`;
  pts.forEach((p,i)=>{g+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2.5"/>`+
    `<text class="lbl" x="${x(i)}" y="${y(p.v)-12}" text-anchor="middle">${p.v.toFixed(1)}</text>`+
    `<text x="${x(i)}" y="${H-B+18}" text-anchor="middle">${esc(p.label)}</text>`+
    (p.note?`<text x="${x(i)}" y="${H-B+33}" text-anchor="middle">${esc(p.note)}</text>`:"");});
  g+=`</svg>`;
  $("#chart").innerHTML=`<div style="font-weight:600;margin-bottom:4px">Champion output tok/s at concurrency 16 (official)</div>`+g;
})();

// tree
const BADGE={champ:["b-champ","★ champion"],win:["b-win","win"],null:["b-null","null"],fail:["b-fail","failed"],diag:["b-diag","diagnosis"],nooff:["b-diag","no official"],pend:["b-off","best measured · below bar"]};
let cur=null;
function renderTree(){
  $("#tree").innerHTML = S.directions.map(d=>{
    const nodes=d.nodes.map(n=>{
      const ind="<span class='indent'></span>".repeat(n.depth||0);
      const b=BADGE[n.status]||null;
      return `<button class="node${n.path?" path":""}" data-id="${n.id}" type="button">${ind}<span class="id">${n.path?"★ ":""}${esc(n.id)}</span><span class="t">${esc(n.title)}</span><span class="r">${esc(n.result||"")}</span>${b?`<span class="badge ${b[0]}">${b[1]}</span>`:""}</button>`;}).join("");
    return `<div class="dir"><h3>${esc(d.title)}</h3><div class="meta">${esc(d.meta)}</div>${nodes}</div>`;}).join("");
  document.querySelectorAll(".node").forEach(b=>b.onclick=()=>select(b.dataset.id));
}
function nodeSpec(id){for(const d of S.directions)for(const n of d.nodes)if(n.id===id)return [d,n];return [null,null];}
function fmt(v,d=1){return v==null?"–":Number(v).toFixed(d)}
function diffHtml(t){return t.split("\n").map(l=>{let c="";if(l.startsWith("+++")||l.startsWith("---")||l.startsWith("diff "))c="f";else if(l.startsWith("@@"))c="h";else if(l.startsWith("+"))c="a";else if(l.startsWith("-"))c="d";return `<span class="${c}">${esc(l)||" "}</span>`}).join("");}
function select(id){
  cur=id; document.querySelectorAll(".node").forEach(b=>b.setAttribute("aria-current",b.dataset.id===id));
  const [d,n]=nodeSpec(id), r=R[id]||{}, rec=r.rec||{};
  let h=`<h2>${esc(id)} — ${esc(n.title)}</h2><div class="sub">${esc(d.title)} · builds on ${esc(n.parent||"BASE")}${n.status&&BADGE[n.status]?` · <span class="badge ${BADGE[n.status][0]}">${BADGE[n.status][1]}</span>`:""}</div>`;
  if(n.takeaway) h+=`<h4>In one line</h4><div class="txt">${esc(n.takeaway)}</div>`;
  const off=(r.official||[]).filter(o=>o.output_throughput!=null);
  if(off.length){const o=off[off.length-1], bt=BASE.output_throughput;
    const gate=(k,v)=>v==null?"–":`<span class="${v==="pass"?"pass":"fail"}">${esc(v)}</span>`;
    h+=`<h4>Official result (#${esc(o.n)})</h4><div class="nums">
      <div class="num"><div class="v">${fmt(o.output_throughput)} tok/s</div><div class="l">output tok/s at c=16${bt?` · ${o.output_throughput>=bt?"+":""}${(100*(o.output_throughput/bt-1)).toFixed(1)}% vs BASE`:""}</div></div>
      <div class="num"><div class="v">${fmt(o.p99_ttft_ms,0)} ms</div><div class="l">TTFT p99 (gate ≤ ${S.gates.ttft} ms)</div></div>
      <div class="num"><div class="v">${fmt(o.p99_tpot_ms)} ms</div><div class="l">TPOT p99 (gate ≤ ${S.gates.tpot} ms)</div></div>
      <div class="num"><div class="v">${o.gsm8k_accuracy!=null?(100*o.gsm8k_accuracy).toFixed(1)+"%":"–"}</div><div class="l">GSM8K (gate ≥ ${S.gates.gsm8k}%)</div></div>
      <div class="num"><div class="v">${fmt(o.mtp_acceptance_length,3)}</div><div class="l">MTP acceptance length</div></div>
      <div class="num"><div class="v">${o.output_throughput_trials?o.output_throughput_trials.map(x=>fmt(x)).join(" / "):"1 trial"}</div><div class="l">trials${o.output_throughput_cv_pct!=null?` · CV ${fmt(o.output_throughput_cv_pct,2)}%`:""}</div></div>
    </div><div style="margin-top:6px;font-size:14px">Gates: GSM8K ${gate("g",o.gate_gsm8k)} · latency ${gate("l",o.gate_latency)} · 128K request ${gate("k",o.gate_long_request)}</div>`;}
  if(rec.performance) h+=`<h4>${off.length?"Record summary":"Result (unofficial)"}</h4><div class="txt">${esc(rec.performance)}</div>`;
  for(const [k,l] of [["hypothesis","Why (hypothesis)"],["change","What changed"],["results","Observed"],["conclusion","Conclusion"],["validity","Validity review"]])
    if(rec[k]) h+=`<h4>${l}</h4><div class="txt">${esc(rec[k])}</div>`;
  if(r.serve_args) h+=`<h4>Extra serve flags (serve_args.txt)</h4><pre class="args">${esc(r.serve_args)}</pre>`;
  h+=`<h4>Code diff (vs the task's baseline vLLM)</h4>`;
  if(!r.diff) h+=`<div class="txt">No code change${r.serve_args?" (flags only)":""}.</div>`;
  else{
    const par=n.parent||"BASE", delta=r.delta_vs_parent||"", fc=r.files_changed_vs_parent||[];
    h+=`<div class="files">${r.diff_files.map(f=>esc(f)+(par!=="BASE"&&fc.includes(f)?(" <span class='badge b-off'>changed vs "+esc(par)+"</span>"):"")).join("<br>")}</div>`;
    if(par!=="BASE"){
      if(!delta) h+=`<div class="txt" style="margin:6px 0">Code identical to ${esc(par)}'s: this record differs only in serve flags, or is a measurement.</div>`;
      else h+=`<details style="margin-top:8px" open><summary>Files changed relative to ${esc(par)} (${fc.length})</summary><pre class="diff">${diffHtml(delta)}</pre></details>`;
    }
    h+=`<details style="margin-top:8px"${par==="BASE"?" open":""}><summary>Full diff vs baseline (${r.diff.split("\n").length} lines; also in diffs/${esc(id)}.diff)</summary><pre class="diff">${diffHtml(r.diff)}</pre></details>`;
  }
  $("#detail").innerHTML=h;
  try{history.replaceState(null,"","#tree:"+id)}catch(e){}
}
renderTree();
const hs=(location.hash||"").slice(1).split(":");
const first=S.champion||S.directions[0].nodes[0].id;
select(hs[0]==="tree"&&hs[1]&&R[hs[1]]?hs[1]:first);
show(TABS.some(t=>t[0]===hs[0])?hs[0]:"overview");
</script>
</body>
</html>
